<style>
  :root{
    --ink:#2c2013;
    --ink-soft:#5a4d3c;
    --paper:#fffdf7;
    --paper-2:#f1e8d3;
    --board:#f4ecd9;
    --board-2:#ecdfbf;
    --board-line:#d9c9a0;
    --slate:#1f3a32;
    --slate-2:#152a24;
    --chalk-gold:#e7b94e;
    --chalk-gold-ink:#3a2a08;
    --mint:#7cc9a0;
    --mint-ink:#0f3823;
    --coral:#e2785f;
    --coral-ink:#4a1a0e;
    --sky:#7fb2c9;
    --field-bg:#fff;
    --line-dash: repeating-linear-gradient(90deg, var(--board-line) 0 10px, transparent 10px 18px);
    --radius: 20px;
    --shadow: 0 8px 22px rgba(90,72,30,.14);
    --ink-rgb: 44,32,19;
    --days-color: var(--ink);
  }
  html[data-theme="dark"]{
    --ink:#ece6d9;
    --ink-soft:#a99d87;
    --paper:#221d17;
    --paper-2:#332c22;
    --board:#161310;
    --board-2:#1d1912;
    --board-line:#3c342a;
    --slate:#16302a;
    --slate-2:#0f221d;
    --chalk-gold:#e7b94e;
    --chalk-gold-ink:#2a1d05;
    --mint:#7cc9a0;
    --mint-ink:#e7f7ee;
    --coral:#e2785f;
    --coral-ink:#fbe5dd;
    --sky:#7fb2c9;
    --field-bg:#2a251d;
    --shadow: 0 8px 22px rgba(0,0,0,.5);
    --ink-rgb: 236,230,217;
    --days-color: var(--chalk-gold);
  }
  html[data-theme="dark"] header.topbar{
    color:#f7f1e3;
  }
  html[data-theme="dark"] body{
    background:
      radial-gradient(ellipse at 15% -10%, #241f18 0%, transparent 55%),
      radial-gradient(ellipse at 100% 115%, #1c1811 0%, transparent 55%),
      var(--board);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow-x:hidden;width:100%;}
  body{
    font-family:'Vazirmatn', Tahoma, sans-serif;
    background:
      radial-gradient(ellipse at 15% -10%, #fbf6e8 0%, transparent 55%),
      radial-gradient(ellipse at 100% 115%, #ecdfbe 0%, transparent 55%),
      var(--board);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    transition:background .25s ease, color .25s ease;
  }
  #shell{
    width:100%;
    max-width:480px;
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
    background:transparent;
  }
  /* header */
  header.topbar{
    padding:22px 18px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--paper);
    position:sticky; top:0; z-index:20;
    background:var(--slate);
    border-radius:0 0 22px 22px;
    box-shadow:0 6px 18px rgba(21,42,36,.25);
  }
  header.topbar .back-btn{
    width:38px;height:38px;border-radius:50%;
    background:rgba(250,243,226,.1);
    border:1px solid rgba(250,243,226,.18);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  header.topbar .back-btn svg{width:18px;height:18px;}
  header.topbar h1{
    font-size:19px; font-weight:800; margin:0; flex:1;
    letter-spacing:.2px;
  }
  header.topbar .sub{
    font-size:11.5px; color:var(--chalk-gold); font-weight:500; margin-top:2px; display:block;
  }
  .next-class-pill{
    display:inline-flex; align-items:center; gap:6px; background:rgba(231,185,78,.16); color:var(--chalk-gold);
    font-size:11.5px; font-weight:700; padding:6px 11px; border-radius:20px; margin-top:8px;
    animation: fadeSlideIn .35s ease both;
  }
  .next-class-pill svg{ width:13px;height:13px; flex-shrink:0; animation: bellRing 2.4s ease-in-out infinite; transform-origin:50% 20%; }

  /* ---- class-approaching alert badge (fixed, top-left) ---- */
  .class-alert-badge{
    position:fixed; top:16px; left:16px; z-index:300;
    width:44px; height:44px; border-radius:50%;
    background:var(--coral); color:var(--coral-ink);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(226,120,95,.45);
    cursor:pointer; animation: badgePop .4s ease both;
  }
  .class-alert-badge svg{ width:20px; height:20px; animation: bellRing 1.6s ease-in-out infinite; }
  .class-alert-badge::before{
    content:''; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid var(--coral); opacity:.6;
    animation: alertRing 1.8s ease-out infinite;
  }
  .class-alert-badge .abadge-count{
    position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 3px;
    background:var(--chalk-gold); color:var(--chalk-gold-ink); border-radius:20px;
    font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  @keyframes alertRing{ 0%{ transform:scale(.8); opacity:.7; } 100%{ transform:scale(1.35); opacity:0; } }
  @keyframes badgePop{ 0%{ transform:scale(.4); opacity:0; } 70%{ transform:scale(1.08); opacity:1; } 100%{ transform:scale(1); } }
  @keyframes bellRing{ 0%,100%{ transform:rotate(0deg); } 10%{ transform:rotate(14deg); } 20%{ transform:rotate(-12deg); } 30%{ transform:rotate(8deg); } 40%{ transform:rotate(-6deg); } 50%{ transform:rotate(0deg); } }
  @keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  .screen-fade{ animation: fadeSlideIn .3s ease both; touch-action:pan-y; }
  .folder-card{ animation: fadeSlideIn .32s ease both; }
  .folder-card:nth-child(1){ animation-delay:.02s; }
  .folder-card:nth-child(2){ animation-delay:.06s; }
  .folder-card:nth-child(3){ animation-delay:.10s; }
  .folder-card:nth-child(4){ animation-delay:.14s; }
  .folder-card:nth-child(5){ animation-delay:.18s; }
  .folder-card:nth-child(6){ animation-delay:.22s; }
  .folder-card:active{ transform:scale(.97); transition:transform .12s ease; }
  .btn{ transition:transform .15s ease, filter .15s ease; }
  .btn:active{ transform:scale(.96); }
  header.topbar .action-btn{
    width:38px;height:38px;border-radius:50%;
    background:rgba(250,243,226,.1);
    border:1px solid rgba(250,243,226,.18);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  header.topbar .action-btn svg{width:17px;height:17px;}

  main{
    flex:1;
    padding:6px 18px 110px;
    overflow-x:hidden;
  }

  /* generic card / paper surface */
  .paper{
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    position:relative;
  }

  h2.section-title{
    color:var(--ink); font-size:14px; font-weight:700; margin:22px 4px 10px;
    display:flex; align-items:center; gap:8px; opacity:.7;
  }
  h2.section-title:first-child{margin-top:8px;}

  /* class folder cards on home */
  .folder-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .folder-card{
    background:var(--paper);
    border-radius:18px;
    padding:16px 14px 14px;
    box-shadow:var(--shadow);
    cursor:pointer;
    position:relative;
    min-height:112px;
    display:flex; flex-direction:column; justify-content:space-between;
    border-top:7px solid var(--tab-color, var(--chalk-gold));
    transition:transform .15s ease;
  }
  .folder-card:active{ transform:scale(.96); }
  .folder-card .fname{ font-weight:800; font-size:15.5px; color:var(--ink); line-height:1.4; }
  .folder-card .fname-days{ display:block; font-size:11px; font-weight:600; color:var(--days-color); opacity:.85; margin-top:3px; }
  .folder-card .fmeta{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; }
  .folder-card .dots{
    position:absolute; top:10px; left:10px; width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
  }
  .folder-card .dots svg{width:15px;height:15px;}
  .folder-card .count-pill{
    align-self:flex-start; margin-top:10px; font-size:11px; font-weight:700;
    background:var(--paper-2); color:var(--ink-soft); padding:3px 9px; border-radius:20px;
  }
  .add-folder-card{
    border:2px dashed rgba(var(--ink-rgb),.22);
    border-radius:18px; min-height:112px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--ink-soft); cursor:pointer; gap:6px;
  }
  .add-folder-card svg{width:26px;height:26px;}
  .add-folder-card span{font-size:12px; font-weight:600;}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty-state svg{width:54px;height:54px;opacity:.6;margin-bottom:10px;}
  .empty-state p{font-size:13.5px; line-height:1.9; margin:0;}

  /* tabs */
  .tabbar{ display:flex; gap:6px; background:rgba(var(--ink-rgb),.06); padding:4px; border-radius:14px; margin:14px 0 16px; }
  .tabbar button{
    flex:1; border:none; background:transparent; color:var(--ink-soft);
    padding:9px 4px; border-radius:11px; font-family:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
  }
  .tabbar button.active{ background:var(--paper); color:var(--ink); opacity:1; }

  /* list rows (students, notes, dates) */
  .row-list{ display:flex; flex-direction:column; gap:10px; }
  .row-card{
    background:var(--paper); border-radius:16px; padding:13px 14px;
    display:flex; align-items:center; gap:12px; box-shadow:0 6px 16px rgba(10,20,17,.22);
    cursor:pointer;
  }
  .row-card:active{ transform:scale(.985); }
  .avatar{
    width:40px;height:40px;border-radius:50%; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:15px; color:#fff;
  }
  .row-main{ flex:1; min-width:0; }
  .row-title{ font-weight:700; font-size:14.5px; color:var(--ink); }
  .row-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .row-score{
    font-weight:800; font-size:15px; border-radius:10px; padding:5px 10px; flex-shrink:0;
  }
  .score-pos{ background:rgba(124,201,160,.25); color:var(--mint-ink); }
  .score-neg{ background:rgba(226,120,95,.22); color:var(--coral-ink); }
  .score-zero{ background:var(--paper-2); color:var(--ink-soft); }

  .chev{ color:var(--ink-soft); flex-shrink:0; }
  .chev svg{width:16px;height:16px;}

  /* buttons */
  .btn{
    border:none; border-radius:14px; padding:13px 18px; font-family:inherit; font-weight:700; font-size:14px;
    cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-gold{ background:var(--chalk-gold); color:var(--chalk-gold-ink); }
  .btn-ghost{ background:rgba(250,243,226,.1); color:var(--paper); border:1px solid rgba(250,243,226,.2); }
  .btn-outline-dark{ background:transparent; color:var(--ink); border:1.5px solid var(--paper-2); }
  .btn-danger{ background:rgba(226,120,95,.15); color:var(--coral-ink); }
  .btn-sm{ padding:9px 12px; font-size:12.5px; width:auto; border-radius:11px; }
  .hw-copy-btn svg{ width:18px; height:18px; }

  /* fab-ish add button fixed */
  .fab{
    position:fixed; bottom:96px; left:50%; transform:translateX(calc(-50% + 190px));
    width:54px;height:54px;border-radius:50%; background:var(--chalk-gold); color:var(--chalk-gold-ink);
    display:flex;align-items:center;justify-content:center; box-shadow:0 8px 22px rgba(231,185,78,.45);
    cursor:pointer; z-index:15; border:none;
  }
  .fab svg{ width:24px; height:24px; }
  @media (max-width:480px){
    .fab{ left:auto; right:20px; transform:none; }
  }

  /* bottom nav */
  nav.bottomnav{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px;
    background:var(--slate-2); border-top:1px solid rgba(250,243,226,.08);
    display:flex; padding:8px 10px calc(10px + env(safe-area-inset-bottom, 0px));
    z-index:20;
  }
  nav.bottomnav button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:rgba(250,243,226,.45); padding:6px 0; cursor:pointer; font-family:inherit;
  }
  nav.bottomnav button.active{ color:var(--chalk-gold); }
  nav.bottomnav button svg{width:21px;height:21px;}
  .nav-bell-ring{ animation: bellRing 1.8s ease-in-out infinite; transform-origin:50% 15%; color:var(--coral) !important; }
  .bell-tap-shake{ animation: bellRing .55s ease-in-out 1; transform-origin:50% 15%; }
  nav.bottomnav button span{font-size:10.5px; font-weight:700;}

  /* class info block */
  .info-card{ background:var(--paper); border-radius:16px; padding:16px; margin-bottom:14px; }
  .info-grid{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  .info-chip{ background:var(--paper-2); border-radius:11px; padding:8px 12px; font-size:12px; color:var(--ink-soft); font-weight:600; }
  .info-chip b{ color:var(--ink); font-weight:800; }

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,18,15,.6); backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-sheet{
    background:var(--paper); width:100%; max-width:480px; border-radius:22px 22px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px)); max-height:85vh; overflow-y:auto;
    animation:sheetUp .22s ease;
  }
  @keyframes sheetUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal-sheet h3{ margin:2px 0 16px; font-size:17px; font-weight:800; color:var(--ink); }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type=text], .field input[type=tel], .field textarea, .field select{
    width:100%; border:1.5px solid var(--paper-2); background:var(--field-bg); border-radius:12px; padding:11px 13px;
    font-family:inherit; font-size:16px; color:var(--ink); outline:none;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--chalk-gold); }
  .field textarea{ resize:vertical; min-height:70px; }
  .seg{ display:flex; gap:8px; }
  .seg.seg-2col{ display:grid; grid-template-columns:1fr 1fr; }
  .seg.seg-3col{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .seg button{
    flex:1; padding:10px 6px; border-radius:11px; border:1.5px solid var(--paper-2); background:var(--field-bg);
    font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .seg button.sel{ background:var(--chalk-gold); border-color:var(--chalk-gold); color:var(--chalk-gold-ink); }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-close-x{
    position:absolute; top:14px; left:14px; width:30px; height:30px; border-radius:50%;
    background:var(--paper-2); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .modal-close-x svg{ width:14px;height:14px; color:var(--ink-soft); }

  /* date picker (day/month) */
  .dp-trigger{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:6px;
    border:1.5px solid var(--paper-2); background:var(--field-bg); border-radius:12px; padding:10px 12px;
    font-family:inherit; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .dp-trigger:active{ background:var(--paper-2); }
  .dp-trigger.dp-empty{ color:var(--ink-soft); font-weight:600; }
  .dp-trigger svg{ width:13px; height:13px; color:var(--chalk-gold); flex-shrink:0; transform:rotate(90deg); opacity:.85; }
  .dp-sheet-title{ display:flex; align-items:center; gap:8px; }
  .dp-sheet-title svg{ width:17px; height:17px; color:var(--chalk-gold); }
  .dp-clear-row{ margin-bottom:14px; }
  .dp-clear-btn{
    width:100%; padding:10px; border-radius:12px; border:1.5px dashed var(--paper-2); background:transparent;
    font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
  }
  .dp-clear-btn:active{ background:var(--paper-2); }
  .dp-day-grid{
    display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; max-height:52vh; overflow-y:auto; padding:2px;
    touch-action:pan-y; will-change:transform;
  }
  .dp-month-nav{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:-4px 0 12px; }
  .dp-month-nav .cal-nav-btn{ width:30px; height:30px; }
  .dp-month-nav .cal-nav-btn svg{ width:13px; height:13px; }
  .dp-month-nav b{ font-size:14px; font-weight:800; color:var(--ink); }
  .dp-day-opt{
    aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; border-radius:13px;
    border:1.5px solid var(--paper-2); background:var(--field-bg); font-family:inherit; font-size:14px;
    font-weight:700; color:var(--ink); cursor:pointer; position:relative; transition:background .12s, border-color .12s, color .12s;
  }
  .dp-day-opt.sel{ background:var(--chalk-gold); border-color:var(--chalk-gold); color:var(--chalk-gold-ink); }
  .dp-day-opt.today:not(.sel)::after{
    content:''; position:absolute; bottom:5px; left:50%; transform:translateX(-50%);
    width:4px; height:4px; border-radius:50%; background:var(--chalk-gold);
  }

  /* Iran calendar screen */
  .cal-hero{
    background:linear-gradient(135deg, var(--slate), var(--slate-2));
    border-radius:22px; padding:18px 18px 16px; margin-bottom:14px; color:var(--paper);
    position:relative; overflow:hidden; box-shadow:var(--shadow);
  }
  .cal-hero::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(circle at 100% 0%, rgba(231,185,78,.20) 0%, transparent 55%);
  }
  .cal-hero-top{ display:flex; align-items:center; gap:13px; position:relative; z-index:1; }
  .cal-hero-daynum{
    width:56px; height:56px; border-radius:16px; flex-shrink:0;
    background:linear-gradient(135deg, var(--chalk-gold), #f0cd7c); color:var(--chalk-gold-ink);
    display:flex; align-items:center; justify-content:center; font-size:23px; font-weight:900;
    box-shadow:0 4px 10px rgba(0,0,0,.18);
  }
  .cal-hero-info{ flex:1; min-width:0; }
  .cal-hero-info b{ display:block; font-size:15px; font-weight:800; }
  .cal-hero-info span{ font-size:11.5px; color:rgba(250,243,226,.68); font-weight:600; }
  .cal-nav-card{
    background:var(--paper); border-radius:18px; padding:14px 16px; margin-bottom:14px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    box-shadow:var(--shadow);
  }
  .cal-nav-btn{
    width:34px; height:34px; border-radius:50%; background:var(--paper-2); color:var(--ink);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    transition:background .15s ease;
  }
  .cal-nav-btn:active{ background:var(--board-2); }
  .cal-nav-btn svg{ width:14px; height:14px; }
  .cal-nav-btn.next svg{ transform:rotate(180deg); }
  .cal-title-wrap{ text-align:center; flex:1; }
  .cal-title-wrap b{ font-size:16.5px; font-weight:800; color:var(--ink); display:block; letter-spacing:.2px; }
  .cal-title-wrap span{ font-size:11px; color:var(--coral); font-weight:700; cursor:pointer; }
  .cal-tabs{ display:flex; gap:22px; margin:4px 4px 14px; border-bottom:1px solid var(--paper-2); }
  .cal-tab{ padding:8px 2px 12px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; position:relative; }
  .cal-tab.active{ color:var(--ink); }
  .cal-tab.active::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height:3px; border-radius:3px 3px 0 0; background:var(--chalk-gold); }
  .cal-grid-card{ background:var(--paper); border-radius:18px; padding:14px; margin-bottom:14px; touch-action:pan-y; will-change:transform; box-shadow:var(--shadow); }
  @keyframes swipeEnterFromRight{ from{ transform:translateX(30px); opacity:0; } to{ transform:translateX(0); opacity:1; } }
  @keyframes swipeEnterFromLeft{ from{ transform:translateX(-30px); opacity:0; } to{ transform:translateX(0); opacity:1; } }
  .swipe-enter-next{ animation:swipeEnterFromRight .3s cubic-bezier(.22,.61,.36,1) both; }
  .swipe-enter-prev{ animation:swipeEnterFromLeft .3s cubic-bezier(.22,.61,.36,1) both; }

  /* ===== flying book (homework tab entrance) ===== */
  .hw-fly-book{
    position:absolute; top:38%; right:-10px; margin-right:-27px; z-index:600;
    width:54px; height:58px; color:var(--chalk-gold);
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.3));
    pointer-events:none; will-change:transform,opacity;
  }
  .hw-fly-book svg{ width:100%; height:100%; }
  .hw-fly-book-inner{ display:block; width:100%; height:100%; transform-origin:50% 50%; animation:bookFlap .5s ease-in-out infinite; }
  @keyframes bookFlap{
    0%,100%{ transform:scaleX(1); }
    50%{ transform:scaleX(.55); }
  }
  @keyframes hwFly1{
    0%{ transform:translate(0,0) rotate(0deg) scale(1); opacity:0; }
    10%{ opacity:1; }
    50%{ transform:translate(-280px,-78px) rotate(-5deg) scale(1); }
    90%{ opacity:1; }
    100%{ transform:translate(-560px,0) rotate(-7deg) scale(1); opacity:0; }
  }
  @keyframes hwFly2{
    0%{ transform:translate(0,0) rotate(3deg) scale(.95); opacity:0; }
    12%{ opacity:1; }
    50%{ transform:translate(-280px,-92px) rotate(-3deg) scale(.95); }
    90%{ opacity:1; }
    100%{ transform:translate(-560px,4px) rotate(-6deg) scale(.95); opacity:0; }
  }
  @keyframes hwFly3{
    0%{ transform:translate(0,10px) rotate(-3deg) scale(1); opacity:0; }
    10%{ opacity:1; }
    50%{ transform:translate(-280px,-64px) rotate(3deg) scale(1); }
    90%{ opacity:1; }
    100%{ transform:translate(-560px,6px) rotate(-4deg) scale(1); opacity:0; }
  }
  @keyframes hwFly4{
    0%{ transform:translate(0,6px) rotate(2deg) scale(1); opacity:0; }
    10%{ opacity:1; }
    50%{ transform:translate(-280px,-82px) rotate(-4deg) scale(1); }
    90%{ opacity:1; }
    100%{ transform:translate(-560px,0) rotate(-5deg) scale(1); opacity:0; }
  }
  @keyframes hwFly5{
    0%{ transform:translate(0,-8px) rotate(-2deg) scale(1); opacity:0; }
    10%{ opacity:1; }
    50%{ transform:translate(-280px,-96px) rotate(4deg) scale(1); }
    90%{ opacity:1; }
    100%{ transform:translate(-560px,2px) rotate(-6deg) scale(1); opacity:0; }
  }
  @keyframes hwFly6{
    0%{ transform:translate(0,0) rotate(0deg) scale(.85); opacity:0; }
    15%{ opacity:1; transform:translate(-70px,-24px) rotate(-2deg) scale(1); }
    50%{ transform:translate(-280px,-80px) rotate(-1deg) scale(1); }
    90%{ opacity:1; }
    100%{ transform:translate(-560px,4px) rotate(-5deg) scale(.9); opacity:0; }
  }
  @keyframes hwFly7{
    0%{ transform:translate(0,4px) rotate(4deg) scale(1); opacity:0; }
    10%{ opacity:1; }
    50%{ transform:translate(-280px,-70px) rotate(-3deg) scale(1); }
    90%{ opacity:1; }
    100%{ transform:translate(-560px,-2px) rotate(-7deg) scale(.95); opacity:0; }
  }
  @keyframes hwFly8{
    0%{ transform:translate(0,-6px) rotate(-3deg) scale(1); opacity:0; }
    10%{ opacity:1; }
    50%{ transform:translate(-280px,-88px) rotate(3deg) scale(1); }
    90%{ opacity:1; }
    100%{ transform:translate(-560px,2px) rotate(-6deg) scale(1); opacity:0; }
  }
  /* pause variants — the book stops for a beat in the middle of the screen */
  @keyframes hwFly9{
    0%{ transform:translate(0,0) rotate(0deg) scale(1); opacity:0; }
    10%{ opacity:1; }
    38%{ transform:translate(-280px,-80px) rotate(-4deg) scale(1); }
    58%{ transform:translate(-280px,-80px) rotate(-4deg) scale(1); }
    92%{ opacity:1; }
    100%{ transform:translate(-560px,4px) rotate(-7deg) scale(1); opacity:0; }
  }
  @keyframes hwFly10{
    0%{ transform:translate(0,8px) rotate(3deg) scale(1); opacity:0; }
    10%{ opacity:1; }
    40%{ transform:translate(-280px,-70px) rotate(2deg) scale(1); }
    62%{ transform:translate(-280px,-70px) rotate(2deg) scale(1); }
    92%{ opacity:1; }
    100%{ transform:translate(-560px,0) rotate(-6deg) scale(1); opacity:0; }
  }
  .hw-fly-1{ animation:hwFly1 2s ease-in-out both; }
  .hw-fly-2{ animation:hwFly2 2.1s ease-in-out both; }
  .hw-fly-3{ animation:hwFly3 2s ease-in-out both; }
  .hw-fly-4{ animation:hwFly4 2.15s ease-in-out both; }
  .hw-fly-5{ animation:hwFly5 2.1s ease-in-out both; }
  .hw-fly-6{ animation:hwFly6 1.95s ease-in-out both; }
  .hw-fly-7{ animation:hwFly7 2.1s ease-in-out both; }
  .hw-fly-8{ animation:hwFly8 2.05s ease-in-out both; }
  .hw-fly-9{ animation:hwFly9 2.7s ease-in-out both; }
  .hw-fly-10{ animation:hwFly10 2.7s ease-in-out both; }
  .cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--paper-2); }
  .cal-weekdays span{ text-align:center; font-size:10.5px; font-weight:700; color:var(--ink-soft); }
  .cal-weekdays span.fri{ color:var(--coral); }
  .cal-days{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .cal-cell{
    aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:12px; font-size:12.5px; font-weight:700; color:var(--ink); position:relative;
  }
  .cal-cell.empty{ visibility:hidden; }

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').then((reg) => {
      // اگر آنلاین بودیم، بلافاصله چک کن نسخه‌ی جدیدی هست یا نه
      if (navigator.onLine && reg) {
        reg.update().catch(() => {});
      }
    }).catch(() => {});

    // وقتی نسخه‌ی جدید فعال شد، یک‌بار خودکار صفحه را رفرش کن تا آپدیت اعمال شود
    let alreadyReloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (alreadyReloaded) return;
      alreadyReloaded = true;
      window.location.reload();
    });
  });

  // هر بار که اتصال اینترنت وصل شد (مثلاً بعد از قطعی)، دوباره چک کن آپدیت هست یا نه
  window.addEventListener('online', () => {
    navigator.serviceWorker.getRegistration().then((reg) => {
      if (reg) reg.update().catch(() => {});
    });
  });
}
</script>

<script>
(function(){
  var CORRECT_PASS = '159753';
  var storedOk = false;
  try { storedOk = localStorage.getItem('dk_unlocked') === 'yes'; } catch(e){}
  var lock = document.getElementById('lockScreen');
  if (storedOk){
    lock.style.display = 'none';
  } else {
    document.getElementById('lockSubmitBtn').addEventListener('click', tryUnlock);
    document.getElementById('lockPassInput').addEventListener('keydown', function(e){
      if (e.key === 'Enter') tryUnlock();
    });
  }
  function tryUnlock(){
    var val = document.getElementById('lockPassInput').value.trim();
    var err = document.getElementById('lockErrorMsg');
    if (val === CORRECT_PASS){
      try { localStorage.setItem('dk_unlocked','yes'); } catch(e){}
      lock.style.display = 'none';
    } else {
      err.style.display = 'block';
    }
  }
  // auto-refresh every 1 hour
  setInterval(function(){ location.reload(); }, 60*60*1000);
})();
</script>

/* ============ storage ============
   priority: claude artifact storage (window.storage) > IndexedDB > localStorage.
   IndexedDB has a much higher capacity than localStorage (hundreds of MB vs ~5-10MB),
   so it's used as the main store when running standalone in a browser.
   Any data previously saved in localStorage is migrated into IndexedDB automatically. */
const STORE_KEY = 'teacher-app-data-v1';
const IDB_NAME = 'teacher-app-db';
const IDB_STORE = 'kv';
let idbOpenPromise = null;
function idbOpen(){
  if (idbOpenPromise) return idbOpenPromise;
  idbOpenPromise = new Promise((resolve, reject)=>{
    try{
      if (!window.indexedDB) { reject(new Error('no indexedDB')); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{ if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    }catch(e){ reject(e); }
  });
  return idbOpenPromise;
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result===undefined ? null : req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function storageGet(key){
  try{
    if (window.storage && typeof window.storage.get === 'function'){
      const r = await window.storage.get(key);
      return r ? r.value : null;
    }
  }catch(e){ /* key may not exist */ }
  try{
    const v = await idbGet(key);
    if (v!=null) return v;
  }catch(e){ /* IndexedDB unavailable, fall through */ }
  try{
    const old = localStorage.getItem(key);
    if (old!=null){
      // one-time migration of older data saved before the IndexedDB switch
      idbSet(key, old).catch(()=>{});
      return old;
    }
  }catch(e){}
  return null;
}
async function storageSet(key, val){
  try{
    if (window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(key, val, false);
      return;
    }
  }catch(e){}
  try{
    await idbSet(key, val);
    return;
  }catch(e){ /* IndexedDB unavailable, fall back to localStorage */ }
  try{ localStorage.setItem(key, val); }catch(e){}
}

function tehranNow(){
  const now = new Date();
  const iso = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Tehran', year:'numeric', month:'2-digit', day:'2-digit'}).format(now);
  const time = new Intl.DateTimeFormat('fa-IR', {timeZone:'Asia/Tehran', hour:'2-digit', minute:'2-digit', hour12:false}).format(now);
  const jalali = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {timeZone:'Asia/Tehran', year:'numeric', month:'long', day:'numeric', weekday:'long'}).format(now);
  const jalaliShort = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {timeZone:'Asia/Tehran', year:'numeric', month:'long', day:'numeric'}).format(now);
  return {iso, time, jalali, jalaliShort};
}
function isoToJalali(iso, withWeekday){
  const d = new Date(iso + 'T12:00:00');
  return new Intl.DateTimeFormat('fa-IR-u-ca-persian', {timeZone:'Asia/Tehran', year:'numeric', month:'long', day:'numeric', weekday: withWeekday ? 'long' : undefined}).format(d);
}
function normalizeDigits(str){
  const fa='۰۱۲۳۴۵۶۷۸۹', ar='٠١٢٣٤٥٦٧٨٩';
  return String(str==null?'':str).replace(/[۰-۹٠-٩]/g, d=>{
    let i = fa.indexOf(d); if (i>-1) return String(i);
    i = ar.indexOf(d); if (i>-1) return String(i);
    return d;
  });
}
function parseTimeToMinutes(str){
  const norm = normalizeDigits(str);
  const m = norm.match(/(\d{1,2})\s*[:.]\s*(\d{1,2})/);
  if (!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}

function jalaliToGregorianIso(jy, jm, jd){
  jy += 1595;
  let days = -355668 + (365*jy) + (Math.floor(jy/33)*8) + (Math.floor(((jy%33)+3)/4)) + jd + ((jm<7) ? (jm-1)*31 : ((jm-7)*30)+186);
  let gy = 400 * Math.floor(days/146097);
  days %= 146097;
  if (days > 36524){
    gy += 100 * Math.floor(--days/36524);
    days %= 36524;
    if (days >= 365) days++;
  }
  gy += 4 * Math.floor(days/1461);
  days %= 1461;
  if (days > 365){
    gy += Math.floor((days-1)/365);
    days = (days-1) % 365;
  }
  let gd = days + 1;
  const sal_a = [0,31,((gy%4===0 && gy%100!==0)||(gy%400===0))?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm;
  for (gm=1; gm<13; gm++){
    const v = sal_a[gm];
    if (gd <= v) break;
    gd -= v;
  }
  const pad = n => String(n).padStart(2,'0');
  return `${gy}-${pad(gm)}-${pad(gd)}`;
}
function nextJalaliOccurrenceIso(jm, jd){
  const now = currentJalaliYMD();

  if (iso < todayIso) iso = jalaliToGregorianIso(now.jy+1, jm, jd);

}

/* --- گاه‌شماری قمری (تقویم هجری جدولی/مدنی) و تبدیل تاریخ --- */
function gregorianToJD(year, month, day){
  const a = Math.floor((14 - month) / 12);
  const y = year + 4800 - a;
  const m = month + 12 * a - 3;
  return day + Math.floor((153*m+2)/5) + 365*y + Math.floor(y/4) - Math.floor(y/100) + Math.floor(y/400) - 32045;
}
function jdToGregorian(jdIn){
  const jd = Math.floor(jdIn);
  const a = jd + 32044;
  const b = Math.floor((4*a+3)/146097);
  const c = a - Math.floor((146097*b)/4);
  const d = Math.floor((4*c+3)/1461);
  const e = c - Math.floor((1461*d)/4);
  const m = Math.floor((5*e+2)/153);
  const day = e - Math.floor((153*m+2)/5) + 1;
  const month = m + 3 - 12*Math.floor(m/10);
  const year = 100*b + d - 4800 + Math.floor(m/10);
  return [year, month, day];
}
const ISLAMIC_EPOCH = 1948439;
function islamicToJD(year, month, day){
  return day + Math.ceil(29.5*(month-1)) + (year-1)*354 + Math.floor((3+11*year)/30) + ISLAMIC_EPOCH - 1;
}
function jdToIslamic(jdIn){
  const jd = Math.floor(jdIn);
  const year = Math.floor((30*(jd-ISLAMIC_EPOCH)+10646)/10631);
  const month = Math.min(12, Math.ceil((jd-(29+islamicToJD(year,1,1)))/29.5) + 1);
  const day = jd - islamicToJD(year, month, 1) + 1;
  return [year, month, day];
}
function gregorianIsoToJalali(targetIso){
  const gy = parseInt(targetIso.slice(0,4),10);
  let jy = gy - 622;
  while (jalaliToGregorianIso(jy+1,1,1) <= targetIso) jy++;
  while (jalaliToGregorianIso(jy,1,1) > targetIso) jy--;
  let jm = 12;
  for (let m=1; m<=12; m++){
    const nextIso = (m<12) ? jalaliToGregorianIso(jy, m+1, 1) : jalaliToGregorianIso(jy+1, 1, 1);
    if (targetIso < nextIso){ jm = m; break; }
  }
  const startOfMonthIso = jalaliToGregorianIso(jy, jm, 1);
  const d1 = new Date(startOfMonthIso+'T00:00:00Z').getTime();
  const d2 = new Date(targetIso+'T00:00:00Z').getTime();
  const jd = Math.round((d2-d1)/86400000) + 1;
  return {jy, jm, jd};
}

  const jdn = islamicToJD(hy, hm, hd);

  return gregorianIsoToJalali(`${gy}-${pad(gm)}-${pad(gd)}`);
}

  const [hyMid] = jdToIslamic(gregorianToJD(gy,gm,gd));
  const out = [];
  LUNAR_HIJRI_HOLIDAYS.forEach(h=>{
    for (let dh=-1; dh<=1; dh++){
      const r = hijriToJalali(hyMid+dh, h.hm, h.hd);
      if (r.jy===jy) out.push({jm:r.jm, jd:r.jd, title:h.title});
    }
  });
  out.sort((a,b)=> a.jm-b.jm || a.jd-b.jd);
  _lunarHolidayCache[jy] = out;
  return out;
}
function holidaysForJalaliDate(jy, jm, jd){
  const list = [];
  FIXED_JALALI_HOLIDAYS.forEach(h=>{ if (h.jm===jm && h.jd===jd) list.push(h.title); });
  lunarHolidaysForJalaliYear(jy).forEach(h=>{ if (h.jm===jm && h.jd===jd) list.push(h.title); });
  return list;
}

function nextClassToday(){
  const t = tehranNowFull();
  const nowMinutes = t.hour*60 + t.minute;
  const candidates = data.classes
    .filter(c => c.info && c.info.startTime && classActiveToday(c, t.weekday))
    .map(c => ({c, m: parseTimeToMinutes(c.info.startTime)}))
    .filter(x => x.m!=null);
  const upcoming = candidates.filter(x => x.m >= nowMinutes).sort((a,b)=>a.m-b.m);
  return upcoming.length ? upcoming[0] : null;
}
function nextClassPillInfo(){
  const t = tehranNowFull();
  const nowMinutes = t.hour*60 + t.minute;
  const candidates = data.classes
    .filter(c => c.info && c.info.startTime && classActiveToday(c, t.weekday))
    .map(c => ({c, m: parseTimeToMinutes(c.info.startTime)}))
    .filter(x => x.m!=null);
  const inWindow = candidates.filter(x => (x.m - nowMinutes) <= PILL_LEAD_MIN && (x.m - nowMinutes) >= -PILL_GRACE_MIN);
  inWindow.sort((a,b)=> Math.abs(a.m-nowMinutes) - Math.abs(b.m-nowMinutes));
  return inWindow.length ? inWindow[0] : null;
}
function minutesUntilNextClass(c){
  if (!c.info || !c.info.startTime) return Infinity;
  const startMin = parseTimeToMinutes(c.info.startTime);
  if (startMin==null) return Infinity;
  const t = tehranNowFull();
  const nowMinutes = t.hour*60 + t.minute;
  for (let i=0;i<=7;i++){
    const d = new Date(Date.now() + i*24*60*60*1000);
    const wd = weekdayNameForDate(d);
    if (!classActiveToday(c, wd)) continue;
    if (i===0 && startMin < nowMinutes - PILL_GRACE_MIN) continue; // already passed today (beyond grace window)
    return i*1440 + (startMin - nowMinutes);
  }
  return Infinity;
}
function validateStartTime(raw){
  const norm = normalizeDigits(String(raw||'')).trim();
  const m = norm.match(/^(\d{1,2}):(\d{1,2})$/);
  if (!m) return null;
  const h = parseInt(m[1],10), mm = parseInt(m[2],10);
  if (h<0 || h>23 || mm<0 || mm>59) return null;
  return `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function scoreColor(value, max){
  if (value==null || value==='') return null;
  const ratio = clamp(value/max, 0, 1);
  const low = {r:196,g:64,b:53}, high = {r:56,g:142,b:96};
  const r = Math.round(low.r + (high.r-low.r)*ratio);
  const g = Math.round(low.g + (high.g-low.g)*ratio);
  const b = Math.round(low.b + (high.b-low.b)*ratio);
  return `rgb(${r},${g},${b})`;
}

async function loadData(){
  const raw = await storageGet(STORE_KEY);
  if (raw){
    try{ data = Object.assign(defaultData(), JSON.parse(raw)); }

  }

function migrateData(){
  if (!data.settings) data.settings = { lang:'fa', langHintSeen:false, theme:'light' };
  if (typeof data.settings.langHintSeen !== 'boolean') data.settings.langHintSeen = false;
  if (data.settings.theme !== 'light' && data.settings.theme !== 'dark') data.settings.theme = 'light';
  (data.classes||[]).forEach(c=>{
    if (!c.info) c.info = {};
    if (!c.info.days){
      // کلاس‌های قدیمی که با سیستم زوج/فرد ذخیره شده بودن؛ چون اون سیستم دیگه استفاده نمی‌شه،
      // برای اینکه هیچ کلاسی گم نشه، پیش‌فرض روی همه‌ی روزهای هفته می‌ذاریم تا خود معلم ویرایشش کنه.
      c.info.days = WEEKDAYS.slice();
      delete c.info.parity;
    }
    if (!c.gender) c.gender = c.gender || '';
    if (!c.reminders) c.reminders = [];
    if (!c.homeworkLog) c.homeworkLog = [];
  });
}

/* ============ backup: export / import ============ */
function exportBackup(classId){
  try{
    const singleClass = classId ? getClass(classId) : null;
    const payload = singleClass
      ? Object.assign({}, defaultData(), { classes:[singleClass], settings: data.settings })
      : data;
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Tehran', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
    const safeName = singleClass ? String(singleClass.name||'class').replace(/[^\p{L}\p{N}_-]+/gu,'-').slice(0,40) : 'daftar-kelas';
    a.href = url;
    a.download = `${safeName}-backup-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast(tr('toast_export_done'));
  }catch(e){ toast(tr('toast_import_error')); }
}
function importBackup(inputEl){
  const file = inputEl.files && inputEl.files[0];
  inputEl.value = '';
  if (!file) return;
  if (!confirm(tr('backup_import_confirm'))) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.classes)) throw new Error('invalid');
      // merge: update classes that already exist (by id), add the ones that don't.
      // this way importing a single-class backup never wipes the rest of the data.
      parsed.classes.forEach(importedClass=>{
        if (!importedClass || !importedClass.id) return;
        const idx = data.classes.findIndex(c=>c.id===importedClass.id);
        if (idx>-1) data.classes[idx] = importedClass;
        else data.classes.push(importedClass);
      });
      migrateData();
      saveData();
      closeModal();
      render();
      toast(tr('toast_import_done'));
    }catch(e){ toast(tr('toast_import_error')); }
  };
  reader.onerror = ()=>{ toast(tr('toast_import_error')); };
  reader.readAsText(file);
}

function getClass(id){ return data.classes.find(c=>c.id===id); }

function studentTotal(student){
  let t=0;
  (student.grades||[]).forEach(g=>{
    if(g.value==='plus') t+=1;
    else if(g.value==='minus') t-=1;
    else if(g.value==='custom') t += (parseFloat(g.amount)||0);
  });
  return t;
}

/* ============ class-approaching alert (top-left badge) ============ */
const CLASS_ALERT_LEAD_MIN = 30;   // چند دقیقه قبل از شروع کلاس، یادآوری نشون داده بشه (زنگوله‌ی پایین)
const CLASS_ALERT_GRACE_MIN = 10;  // چند دقیقه بعد از شروع هم، یادآوری بمونه (زنگوله‌ی پایین)
const PILL_LEAD_MIN = 60;   // چند دقیقه قبل از شروع کلاس، پیل «کلاس بعدی» نشون داده بشه
const PILL_GRACE_MIN = 5;   // چند دقیقه بعد از شروع هم، پیل بمونه
const BADGE_LEAD_MIN = 60;  // چند دقیقه قبل از شروع کلاس، زنگوله‌ی بالا سمت چپ نشون داده بشه
const BADGE_GRACE_MIN = 15; // چند دقیقه بعد از شروع هم، زنگوله بمونه (مگراینکه معلم زودتر روش بزنه)
function renderClassAlert(){
  const badge = document.getElementById('classAlertBadge');
  if (!badge) return;
  const c = nearbyClassWithReminder(BADGE_LEAD_MIN, BADGE_GRACE_MIN);
  const dismissed = c && dismissedReminderAlert && dismissedReminderAlert.classId===c.id && dismissedReminderAlert.count===c.reminders.length;
  if (!c || dismissed){ badge.style.display='none'; badge.onclick=null; applyBellRingState(); return; }
  const label = `یادآوری برای ${c.name}`;
  badge.style.display='flex';
  badge.title = label;
  badge.innerHTML = `${ICON.bell}`;
  badge.onclick = ()=>{ dismissReminderAlert(BADGE_LEAD_MIN, BADGE_GRACE_MIN); state.screen='reminders'; state.reminderClassId=c.id; render(); };
  applyBellRingState();
}
setInterval(()=>{ try{ renderClassAlert(); renderTopbar(); }catch(e){} }, 20000);

let dismissedReminderAlert = null; // {classId, count} — یادآوری‌ای که کاربر دیده و تا یادآوری بعدی خاموش شده
function nearbyClassWithReminder(leadMin, graceMin){
  leadMin = leadMin==null ? CLASS_ALERT_LEAD_MIN : leadMin;
  graceMin = graceMin==null ? CLASS_ALERT_GRACE_MIN : graceMin;
  const t = tehranNowFull();
  const nowMinutes = t.hour*60 + t.minute;
  const candidates = data.classes
    .filter(c => c.info && c.info.startTime && classActiveToday(c, t.weekday) && c.reminders && c.reminders.length)
    .map(c => ({c, m: parseTimeToMinutes(c.info.startTime)}))
    .filter(x => x.m!=null)
    .map(x => Object.assign({}, x, {nowMinutes}));
  const soon = candidates.filter(x => (x.m - nowMinutes) <= leadMin && (x.m - nowMinutes) >= -graceMin);
  soon.sort((a,b)=> Math.abs(a.m-nowMinutes) - Math.abs(b.m-nowMinutes));
  return soon.length ? soon[0].c : null;
}
function reminderAlertActive(){
  const c = nearbyClassWithReminder(CLASS_ALERT_LEAD_MIN, CLASS_ALERT_GRACE_MIN);
  if (!c) return false;
  if (dismissedReminderAlert && dismissedReminderAlert.classId===c.id && dismissedReminderAlert.count===c.reminders.length) return false;
  return true;
}
function dismissReminderAlert(leadMin, graceMin){
  const c = nearbyClassWithReminder(leadMin, graceMin);
  if (c) dismissedReminderAlert = {classId:c.id, count:c.reminders.length};
}

function animateBellIcon(){
  const btn = document.querySelector('#bottomnav button[data-key="reminders"]');
  if (!btn) return;
  const svgEl = btn.querySelector('svg');
  if (!svgEl) return;
  svgEl.classList.remove('bell-tap-shake');
  void svgEl.offsetWidth; // force reflow so the animation can retrigger on repeated taps
  svgEl.classList.add('bell-tap-shake');
  setTimeout(()=>{ svgEl.classList.remove('bell-tap-shake'); }, 600);
}
function diceFaceSVG(n){
  const pips = {
    1:[[12,12]], 2:[[7,7],[17,17]], 3:[[7,7],[12,12],[17,17]],
    4:[[7,7],[17,7],[7,17],[17,17]], 5:[[7,7],[17,7],[12,12],[7,17],[17,17]],
    6:[[7,7],[17,7],[7,12],[17,12],[7,17],[17,17]]
  }[n] || [[12,12]];
  const circles = pips.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.6" fill="currentColor"/>`).join('');
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/>${circles}</svg>`;
}
function animateDiceIcon(){
  const btn = document.querySelector('#bottomnav button[data-key="spin"]');
  if (!btn) return;
  let count = 0;
  const iv = setInterval(()=>{
    count++;
    const svgEl = btn.querySelector('svg');
    if (!svgEl){ clearInterval(iv); return; }
    svgEl.outerHTML = diceFaceSVG(Math.floor(Math.random()*6)+1);
    const fresh = btn.querySelector('svg');
    fresh.style.transition = 'transform .1s ease';
    fresh.style.transform = `rotate(${count*70}deg) scale(1.15)`;
    if (count>=5){
      clearInterval(iv);
      const last = btn.querySelector('svg');
      if (last) last.outerHTML = ICON.dice;
    }
  }, 90);
}
function applyBellRingState(){
  const btn = document.querySelector('#bottomnav button[data-key="reminders"]');
  if (!btn) return;
  const svgEl = btn.querySelector('svg');
  if (!svgEl) return;
  if (reminderAlertActive()) svgEl.classList.add('nav-bell-ring');
  else svgEl.classList.remove('nav-bell-ring');
}

function resetClassStudentsData(cid){

/* ============ HOMEWORK TAB ============ */

  const locked = !!today.finalized;
  const gs = c.homeworkGradeSettings || {};
  const checksHtml = c.students.length ? c.students.map((s,i)=>{

    let tagAmount = null;
    if (done && gs.posEnabled && typeof gs.posAmount==='number' && gs.posAmount>0) tagAmount = gs.posAmount;
    else if (!done && gs.negEnabled && typeof gs.negAmount==='number' && gs.negAmount<0) tagAmount = gs.negAmount;
    const tag = tagAmount!=null ? `<div class="hw-score-tag ${tagAmount>0?'pos':'neg'}">${tagAmount>0?'+':''}${tagAmount}</div>` : '';
    return `
      <div class="spin-chk-row ${done?'sel':''}${locked?' locked':''}" ${locked?'':`onclick="toggleHomeworkCheck('${c.id}','${s.id}')"`}>
        <div class="box">${ICON.check}</div>
        <div class="avatar" style="width:32px;height:32px;font-size:12px;background:${colorForIndex(i)}">${initials(s.name)}</div>
        <div class="stitle">${escapeHtml(s.name)}</div>
        <div class="scount">${done?tr('hw_done'):tr('hw_not_done')}</div>

      </div>`;
  }).join('') : '';

      <div class="htxt">${escapeHtml(c.homework[iso].text)}</div>
      <div class="htime">${isoToJalali(iso)}</div>
    </div>`).join('');

  let flyBookHtml = '';
  if (state.hwFlyActive){
    flyBookHtml = `<div class="hw-fly-book hw-fly-${state.hwFlyVariant}"><span class="hw-fly-book-inner">${ICON.book}</span></div>`;
    state.hwFlyActive = false;
  }

  return `
    ${flyBookHtml}
    <div class="info-card">
      <label style="display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;">${tr('hw_today_label')} (${t.jalaliShort})</label>
      <textarea id="hw_text" placeholder="${tr('hw_ph')}" style="width:100%;border:1.5px solid var(--paper-2);border-radius:12px;padding:11px 13px;font-family:inherit;font-size:16px;min-height:70px;">${escapeHtml(today.text||'')}</textarea>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-gold btn-sm" style="flex:1;" onclick="saveHomeworkText('${c.id}')">${tr('btn_save_hw')}</button>
        <button class="btn btn-sm hw-copy-btn" title="${tr('btn_copy_hw')}" style="width:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:center;background:var(--paper-2);color:var(--ink);" onclick="copyHomeworkText()">${ICON.copy}</button>
      </div>
    </div>
    <div class="info-card" style="margin-top:14px;">
      <div class="hw-grade-set-title">${tr('hw_grade_settings_title')}</div>
      <div class="hw-grade-row ${gs.posEnabled?'':'is-off'}">
        <div class="hw-grade-label">${tr('hw_grade_pos_label')}</div>
        <input type="number" step="any" inputmode="decimal" class="hw-grade-input" id="hw_pos_amount" value="${gs.posAmount!=null?gs.posAmount:''}" placeholder="${tr('hw_grade_pos_ph')}" onchange="saveHomeworkGradeAmount('${c.id}','pos', this.value)">
        <button type="button" class="hw-grade-toggle ${gs.posEnabled?'on':'off'}" onclick="toggleHomeworkGradeEnabled('${c.id}','pos')">${gs.posEnabled?tr('toggle_on'):tr('toggle_off')}</button>
      </div>
      <div class="hw-grade-row ${gs.negEnabled?'':'is-off'}">
        <div class="hw-grade-label">${tr('hw_grade_neg_label')}</div>
        <input type="number" step="any" inputmode="decimal" class="hw-grade-input" id="hw_neg_amount" value="${gs.negAmount!=null?gs.negAmount:''}" placeholder="${tr('hw_grade_neg_ph')}" onchange="saveHomeworkGradeAmount('${c.id}','neg', this.value)">
        <button type="button" class="hw-grade-toggle ${gs.negEnabled?'on':'off'}" onclick="toggleHomeworkGradeEnabled('${c.id}','neg')">${gs.negEnabled?tr('toggle_on'):tr('toggle_off')}</button>
      </div>
    </div>
    ${c.students.length ? `
      <h2 class="section-title" style="margin-top:20px;">${tr('hw_checklist_title')}</h2>
      ${locked ? `<div class="locked-banner">${ICON.lock} ${tr('hw_locked_banner')}</div>` : ''}
      <div class="row-list">${checksHtml}</div>
      ${locked ? `

        </div>
        <button type="button" class="btn btn-outline-dark btn-sm" style="width:100%;margin-top:10px;" onclick="unlockHomeworkChecklist('${c.id}')">${tr('hw_edit_checklist')}</button>
      ` : `
        <div class="lock-bar" onclick="toggleHomeworkFinalize('${c.id}')">
          <div class="box">${ICON.check}</div>
          <div><b>${tr('hw_finalize_title')}</b><span>${tr('hw_finalize_sub')}</span></div>

    <h2 class="section-title" style="margin-top:22px;">${tr('hw_assign_history_title')}</h2>
    ${assignHistory ? `<div class="info-card" style="padding:6px 14px;">${assignHistory}</div>` : `<p style="font-size:12.5px;color:var(--ink-soft);padding:6px 4px;">${tr('hw_history_none')}</p>`}
  `;
}
function toggleHomeworkGradeEnabled(cid, type){
  const c = getClass(cid);
  if (!c.homeworkGradeSettings) c.homeworkGradeSettings = {};
  const key = type==='pos' ? 'posEnabled' : 'negEnabled';
  c.homeworkGradeSettings[key] = !c.homeworkGradeSettings[key];
  saveData(); render();
}
function saveHomeworkGradeAmount(cid, type, raw){
  const c = getClass(cid);
  if (!c.homeworkGradeSettings) c.homeworkGradeSettings = {};
  const key = type==='pos' ? 'posAmount' : 'negAmount';
  if (raw===''){ c.homeworkGradeSettings[key] = null; saveData(); render(); return; }
  const val = parseFloat(raw);
  if (isNaN(val)){ render(); return; }
  if (type==='pos' && val<=0){ toast(tr('toast_hw_grade_pos_invalid')); render(); return; }
  if (type==='neg' && val===0){ toast(tr('toast_hw_grade_neg_invalid')); render(); return; }
  const finalVal = type==='neg' ? -Math.abs(val) : val;
  c.homeworkGradeSettings[key] = finalVal;
  saveData(); render();
}
function applyHomeworkGrades(c, rec, t){
  const gs = c.homeworkGradeSettings || {};
  if (!rec.homeworkGrades) rec.homeworkGrades = {};
  c.students.forEach(s=>{
    const prev = rec.homeworkGrades[s.id];
    if (prev){
      s.grades = (s.grades||[]).filter(g=>g.id!==prev.id);
      delete rec.homeworkGrades[s.id];
    }
    const done = !!rec.checks[s.id];
    let amount = null;
    if (done && gs.posEnabled && typeof gs.posAmount==='number' && gs.posAmount>0) amount = gs.posAmount;
    else if (!done && gs.negEnabled && typeof gs.negAmount==='number' && gs.negAmount<0) amount = gs.negAmount;
    if (amount!=null){
      if (!s.grades) s.grades=[];
      const gid = uid();
      s.grades.push({id:gid, value:'custom', amount, iso:t.iso, time:t.time, jalaliShort:t.jalaliShort, note: done?tr('hw_grade_note_done'):tr('hw_grade_note_missed')});
      rec.homeworkGrades[s.id] = {id:gid, amount};
    }
  });
}
function removeHomeworkGrades(c, rec){
  if (!rec.homeworkGrades) return;
  c.students.forEach(s=>{
    const prev = rec.homeworkGrades[s.id];
    if (prev){ s.grades = (s.grades||[]).filter(g=>g.id!==prev.id); }
  });
  rec.homeworkGrades = {};
}
function saveHomeworkText(cid){
  const c = getClass(cid); const t = tehranNow();
  const text = document.getElementById('hw_text').value.trim();
  if (!c.homework[t.iso]) c.homework[t.iso] = {text:'', checks:{}, finalized:false};
  c.homework[t.iso].text = text;
  saveData(); render(); toast(tr('toast_hw_saved'));
}
function copyHomeworkText(){
  const el = document.getElementById('hw_text');
  const text = el ? el.value.trim() : '';
  if (!text){ toast(tr('toast_hw_empty_copy')); return; }
  const done = () => toast(tr('toast_hw_copied'));
  const fail = () => {
    try{
      el.focus(); el.select();
      document.execCommand('copy');
      done();
    }catch(e){ toast(tr('toast_hw_empty_copy')); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fail);
  } else {
    fail();
  }
}
function unlockHomeworkChecklist(cid){
  const c = getClass(cid); const t = tehranNow();
  const rec = c.homework[t.iso];
  if (!rec || !rec.finalized) return;
  removeHomeworkGrades(c, rec);
  rec.finalized = false;
  saveData(); render();
}
function toggleHomeworkCheck(cid, sid){
  const c = getClass(cid); const t = tehranNow();
  if (!c.homework[t.iso]) c.homework[t.iso] = {text:'', checks:{}, finalized:false};
  const rec = c.homework[t.iso];
  const wasFinalized = rec.finalized;
  rec.finalized = false;
  rec.checks[sid] = !rec.checks[sid];
  if (wasFinalized){ removeHomeworkGrades(c, rec); }
  saveData(); render();
}
function toggleHomeworkFinalize(cid){
  const c = getClass(cid); const t = tehranNow();
  if (!c.homework[t.iso]) c.homework[t.iso] = {text:'', checks:{}, finalized:false};
  const rec = c.homework[t.iso];
  if (!rec.finalized){
    if (!c.homeworkLog) c.homeworkLog = [];
    c.students.forEach(s=>{
      rec.checks[s.id] = !!rec.checks[s.id];
      if (!rec.checks[s.id]){
        const existing = c.homeworkLog.find(l=>l.iso===t.iso && l.studentId===s.id);
        if (existing){ existing.text = rec.text; existing.studentName = s.name; }
        else { c.homeworkLog.push({id:uid(), studentId:s.id, studentName:s.name, text:rec.text, iso:t.iso, jalaliShort:t.jalaliShort}); }
      }
    });
    applyHomeworkGrades(c, rec, t);
    rec.finalized = true;
    toast(tr('toast_hw_finalized'));
  } else {
    removeHomeworkGrades(c, rec);
    rec.finalized = false;
  }
  saveData(); render();
}
function deleteHomeworkLogEntry(cid, lid){
  const c = getClass(cid);
  c.homeworkLog = (c.homeworkLog||[]).filter(l=>l.id!==lid);
  saveData(); render();
}

function renderAttendanceDay(c, iso, isHistory){
  const rec = c.attendance[iso] || {records:{}, finalized:false};
  const locked = !!rec.finalized;
  const t = tehranNow();
  const dateLabel = isHistory ? isoToJalali(iso, true) : `${t.jalali} — ${t.time}`;
  const rows = c.students.map(s=>{
    const v = rec.records[s.id];
    return `
      <div class="att-row">
        <div class="row-main"><div class="row-title">${escapeHtml(s.name)}</div></div>
        <div class="att-toggle">
          <button class="present ${v==='present'?'sel':''}" ${locked?'disabled':''} onclick="setAttendance('${c.id}','${s.id}','present','${iso}')">${tr('att_present')}</button>
          <button class="absent ${v==='absent'?'sel':''}" ${locked?'disabled':''} onclick="setAttendance('${c.id}','${s.id}','absent','${iso}')">${tr('att_absent')}</button>
        </div>
      </div>`;
  }).join('');
  return `
    <div class="info-chip" style="display:inline-block;margin-bottom:14px;">${dateLabel}</div>
    ${locked ? `<div class="locked-banner">${ICON.lock} ${tr('att_locked_banner')}</div>` : ''}
    ${c.students.length ? `<div class="row-list">${rows}</div>` : `<div class="empty-state"><p>${tr('add_student_first')}</p></div>`}
    ${c.students.length ? (locked ? `
      <div class="lock-bar checked">
        <div class="box">${ICON.check}</div>
        <div><b>${tr('att_finalize_title')}</b><span>${tr('att_finalize_sub')}</span></div>
      </div>
      <button type="button" class="btn btn-outline-dark btn-sm" style="width:100%;margin-top:10px;" onclick="unlockAttendance('${c.id}','${iso}')">${tr('att_edit_day')}</button>
    ` : `
      <div class="lock-bar" onclick="toggleFinalize('${c.id}','${iso}')">
        <div class="box">${ICON.check}</div>
        <div><b>${tr('att_finalize_title')}</b><span>${tr('att_finalize_sub')}</span></div>
      </div>
    `) : ''}
    ${!isHistory ? `<button class="btn btn-outline-dark" style="margin-top:16px;" onclick="openAttHistory()">${tr('btn_view_att_history')}</button>` : ''}
  `;
}
function renderAttendanceTab(c){ return renderAttendanceDay(c, tehranNow().iso, false); }
function setAttendance(cid, sid, val, iso){
  const c = getClass(cid);
  if (!c.attendance[iso]) c.attendance[iso] = {records:{}, finalized:false};
  c.attendance[iso].finalized = false;
  const cur = c.attendance[iso].records[sid];
  c.attendance[iso].records[sid] = (cur===val) ? undefined : val;
  saveData(); render();
}
function toggleFinalize(cid, iso){
  const c = getClass(cid);
  if (!c.attendance[iso]) c.attendance[iso] = {records:{}, finalized:false};
  const rec = c.attendance[iso];
  if (!rec.finalized){
    const missing = c.students.filter(s=>!rec.records[s.id]);
    if (missing.length>0){ toast(tr('toast_att_all_required')); return; }
    const t = tehranNow();
    rec.finalized = true; rec.finalizedTime = t.time;
    toast(tr('toast_att_finalized'));
  } else {
    rec.finalized = false;
  }
  saveData(); render();
}
function unlockAttendance(cid, iso){
  const c = getClass(cid);
  if (c.attendance[iso]) c.attendance[iso].finalized = false;
  saveData(); render();
}

function setSpinMode(m){ state.spinMode = m; render(); }
function toggleSpinClass(id){
  state.spinSelected[id] = !state.spinSelected[id];
  state.spinBag=[]; state.spinAll=[]; state.spinWinner=null;
  render();
}
function buildSpinPool(){
  let pool=[];
  data.classes.forEach(c=>{
    if (state.spinSelected[c.id]){
      c.students.forEach(s=> pool.push({student:s, cls:c}));
    }
  });
  return pool;
}
function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function startSpin(){
  const pool = buildSpinPool();
  if (pool.length===0){ toast(tr('toast_pick_class')); return; }
  // shuffle-bag: don't repeat a student until everyone in the pool has been asked once
  if (state.spinBag.length===0 || state.spinAll.length!==pool.length){
    state.spinAll = pool;
    state.spinBag = shuffle(pool);
  }
  state.spinWinner=null;
  state.spinning=true;
  render();
  const displayPool = pool;
  let ticks=0;
  const maxTicks = 22;
  const reelEl = ()=>document.getElementById('reelName');
  const interval = setInterval(()=>{
    ticks++;
    const rnd = displayPool[Math.floor(Math.random()*displayPool.length)];
    const color = FOLDER_COLORS[Math.floor(Math.random()*FOLDER_COLORS.length)];
    const el = reelEl();
    if (el){ el.textContent = rnd.student.name; el.style.color = color; }
    if (ticks>=maxTicks){
      clearInterval(interval);
      const winner = state.spinBag.pop();
      state.spinWinner = winner;
      state.spinWinnerColor = FOLDER_COLORS[Math.floor(Math.random()*FOLDER_COLORS.length)];
      state.spinning=false;
      render();
    }
  }, ticks<10?70:120);
}
function gradeFromSpin(value){
  if (!state.spinWinner) return;
  const {student} = state.spinWinner;
  const t = tehranNow();

  if (state.spinMode==='oral'){
    const max = EXAM_LIMITS.oral;
    if (value==='plus'){
      student.oral = clamp((student.oral!=null?student.oral:0)+1, 0, max);
    } else if (value==='minus'){
      student.oral = clamp((student.oral!=null?student.oral:0)-1, 0, max);
    } else if (value==='neutral'){
      saveData();
      toast(tr('toast_recorded_no_change'));
      state.spinWinner=null;
      render();
      return;
    } else if (value==='custom'){
      const el = document.getElementById('oralDirectInput');
      const v = parseFloat(el ? el.value : '');
      if (isNaN(v)){ toast(tr('toast_enter_number')); return; }
      if (v<0 || v>max){ toast(tr('toast_oral_range').replace('{max}', max)); return; }
      student.oral = v;
    }
    saveData();
    toast(tr('toast_oral_saved'));
    state.spinWinner=null;
    render();
    return;
  }

  if (value==='custom'){
    const el = document.getElementById('spinCustomInput');
    const amount = parseFloat(el ? el.value : '');
    if (isNaN(amount)){ toast(tr('toast_enter_number')); return; }
    if (!student.grades) student.grades=[];
    student.grades.push({id:uid(), value:'custom', amount, iso:t.iso, time:t.time, jalaliShort:t.jalaliShort, note:tr('grade_note_from_spin')});
  } else {
    if (!student.grades) student.grades=[];
    student.grades.push({id:uid(), value, iso:t.iso, time:t.time, jalaliShort:t.jalaliShort, note:tr('grade_note_from_spin')});
  }
  saveData();
  toast(tr('toast_grade_saved'));
  state.spinWinner=null;
  render();
}

/* ============ swipe paging (like a phone home-screen) ============ */
/* برای تقویم (تعویض ماه) و برای انتخابگر روز در یادآوری‌ها (تعویض ماه) */
function initSwipePaging(rootEl, panelSelector, onSwipe, guard){
  let sx=0, sy=0, panel=null, locked=null, dragging=false;
  const THRESHOLD = 44;   // حداقل جابه‌جایی افقی (px) برای ثبت سوایپ
  rootEl.addEventListener('touchstart', (e)=>{
    if (guard && !guard()) return;
    const t = e.target.closest(panelSelector);
    if (!t) return;
    panel = t;
    const touch = e.touches[0];
    sx = touch.clientX; sy = touch.clientY;
    dragging = true; locked = null;
    panel.style.transition = 'none';
  }, {passive:true});
  rootEl.addEventListener('touchmove', (e)=>{
    if (!dragging || !panel) return;
    const touch = e.touches[0];
    const dx = touch.clientX - sx;
    const dy = touch.clientY - sy;
    if (locked===null) locked = (Math.abs(dx) > Math.abs(dy)+4) ? 'x' : 'y';
    if (locked==='x'){
      panel.style.transform = `translateX(${dx}px)`;
      panel.style.opacity = String(Math.max(.4, 1 - Math.abs(dx)/260));
    }
  }, {passive:true});
  function release(e){
    if (!dragging || !panel){ dragging=false; return; }
    dragging = false;
    const p = panel; panel = null;
    if (locked!=='x'){ p.style.transform=''; p.style.opacity=''; locked=null; return; }
    if (guard && !guard()){ p.style.transform=''; p.style.opacity=''; locked=null; return; }
    const touch = (e.changedTouches && e.changedTouches[0]) || {clientX:sx};
    const dx = touch.clientX - sx;
    p.style.transition = 'transform .22s cubic-bezier(.22,.61,.36,1), opacity .22s ease';
    if (Math.abs(dx) > THRESHOLD){
      // چپ بکشی=ماه بعد، راست بکشی=ماه قبل (دقیقا مثل صفحه‌ی اول گوشی)
      const dir = dx > 0 ? -1 : 1;
      const exitX = dx > 0 ? window.innerWidth*0.5 : -window.innerWidth*0.5;
      p.style.transform = `translateX(${exitX}px)`;
      p.style.opacity = '0';
      haptic(6);
      setTimeout(()=>{ onSwipe(dir); }, 120);
    } else {
      p.style.transform = 'translateX(0)';
      p.style.opacity = '1';
    }
    locked = null;
  }
  rootEl.addEventListener('touchend', release, {passive:true});
  rootEl.addEventListener('touchcancel', ()=>{
    if (panel){ panel.style.transition='transform .2s ease, opacity .2s ease'; panel.style.transform=''; panel.style.opacity=''; }
    dragging=false; panel=null; locked=null;
  }, {passive:true});
}

function addReminder(cid){

  if (day && month){

  }

function copyReminderText(cid, rid){
  const c = getClass(cid);
  const n = (c.reminders||[]).find(r=>r.id===rid);
  const text = n ? n.text : '';
  if (!text) return;
  const done = () => toast(tr('toast_reminder_copied'));
  const fail = () => {
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      done();
    }catch(e){}
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(fail);
  } else {
    fail();
  }
}

function calShiftMonth(delta){
  let jm = state.calJM + delta;
  let jy = state.calJY;
  if (jm < 1){ jm = 12; jy -= 1; }
  else if (jm > 12){ jm = 1; jy += 1; }
  state.calJM = jm; state.calJY = jy;
  state.calAnimDir = delta > 0 ? 'next' : 'prev';
  render();
}

function calGShiftMonth(delta){

  const weekdaysHtml = weekdayHeaders.map((w,i)=>`<span class="${i===6?'fri':''}">${w}</span>`).join('');

  for (let i=0;i<leadBlanks;i++){ cellsHtml += `<div class="cal-cell empty"></div>`; }

    const isToday = jy===curJ.jy && jm===curJ.jm && d===curJ.jd;

function readAndResizeImage(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w=img.width, h=img.height;
      if (w>h){ if (w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; } }
      else { if (h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; } }
      const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
      const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',0.82));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

(async function init(){
  await loadData();
  render();
  initSwipeNav();
})();
